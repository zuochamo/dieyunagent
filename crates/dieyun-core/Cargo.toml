[package]
name = "dieyun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dieyun high-performance core (FS, codebase index, RPC sidecar)"

[[bin]]
name = "dieyun-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ndarray = { version = "0.17.2", optional = true }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "download-binaries", "ndarray", "tls-rustls", "copy-dylibs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23.1", optional = true, default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.24"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.23.6"
tree-sitter-go = "0.23.4"
tree-sitter-rust = "0.24.2"

[features]
default = ["builtin-ort"]
builtin-ort = ["dep:ort", "dep:ndarray", "dep:tokenizers"]

[dev-dependencies]
tempfile = "3"