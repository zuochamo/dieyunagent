[package]
name = "dieyun-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Dieyun high-performance core (FS, codebase index, RPC sidecar)"

[[bin]]
name = "dieyun-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
# 目录遍历的忽略规则引擎（.gitignore / .ignore / global gitignore）——与 ripgrep 同源，
# 不再自己维护 IGNORE_DIRS 词表。见 src/index/walker.rs。
ignore = "0.4"
ndarray = { version = "0.17.2", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "download-binaries", "ndarray", "tls-rustls", "copy-dylibs"] }
# 遍历后的「是否文本」内容嗅探是逐文件 IO：并行跑，串行只负责 readdir。
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokenizers = { version = "0.23.1", optional = true, default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24.2"

[features]
default = ["builtin-ort"]
builtin-ort = ["dep:ort", "dep:ndarray", "dep:tokenizers"]

[dev-dependencies]
tempfile = "3"
