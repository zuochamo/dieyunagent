[workspace]
members = ["crates/dieyun-base", "crates/dieyun-core", "crates/dieyun-memory", "crates/dieyun-codebase", "crates/dieyun-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
# edition 2024：与工具链（rustc 1.96）对齐，拿到新的借用检查与语言级整理。
# rust-version 一并固定，避免有人用旧工具链构建出看不懂的错误。
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["PixelOffice"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# clippy 风格开关的唯一来源：以前这 17 条 `#![allow(…)]` 写在 dieyun-core 的 lib.rs，
# 拆 crate 之后只对一个 crate 生效（新 crate 立刻红）。成员里写 `[lints] workspace = true` 即可。
[workspace.lints.clippy]
redundant_field_names = "allow"
needless_question_mark = "allow"
manual_clamp = "allow"
type_complexity = "allow"
manual_find = "allow"
too_many_arguments = "allow"
manual_contains = "allow"
collapsible_if = "allow"
while_let_on_iterator = "allow"
blocks_in_conditions = "allow"
cmp_owned = "allow"
unnecessary_lazy_evaluations = "allow"
format_in_format_args = "allow"
derivable_impls = "allow"
map_identity = "allow"
needless_range_loop = "allow"
trim_split_whitespace = "allow"
